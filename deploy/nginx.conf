# Nginx reverse proxy for peopleforce-mcp
# Replace pfmcp.barbamarin.com with your actual domain name.
# SSL certificates are managed by certbot (see README deployment steps).

server {
    listen 80;
    server_name pfmcp.barbamarin.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pfmcp.barbamarin.com;

    ssl_certificate     /etc/letsencrypt/live/pfmcp.barbamarin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pfmcp.barbamarin.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Required for SSE: disable response buffering so events flush immediately
    proxy_buffering         off;
    proxy_cache             off;
    add_header              X-Accel-Buffering no;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # Increase timeouts for long-lived SSE connections
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
